<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>RenderCAD Capture</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: transparent;
            margin: 0;
            padding: 0;
        }
        /* Add a very subtle background layer for backdrop-filter to blur */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: 
                radial-gradient(circle at 20% 50%, rgba(120, 119, 198, 0.03) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(255, 119, 198, 0.03) 0%, transparent 50%),
                radial-gradient(circle at 40% 20%, rgba(119, 198, 255, 0.03) 0%, transparent 50%);
            z-index: -1;
            pointer-events: none;
        }
        #overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 999999;
        }
    </style>
</head>
<body>
    <div id="overlay"></div>
    <script src="capture.js"></script>
</body>
</html>
