<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>RenderCAD</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="header">
        <div class="title-wrapper">
            <img src="../assets/icons/logo.svg" alt="RenderCAD Logo" class="title-logo" onerror="this.style.display='none'">
            <h1>RenderCAD</h1>
        </div>
        <div class="subtitle">AI-Powered CAD Rendering</div>
    </div>

    <div class="content">
        <div class="loading" id="loading">
            <div class="spinner"></div>
        </div>

        <div class="account-info" id="accountInfo">
            <!-- Capture button at TOP -->
            <div class="button-group">
                <button class="button primary" id="captureBtn"><i class="fas fa-camera"></i> Capture & Render</button>
            </div>

            <!-- Account info -->
            <div class="status-section">
                <div class="info-row">
                    <div class="status-label">Account</div>
                    <div class="status-value" id="userEmail">
                        <span id="emailText">loading...</span>
                        <span class="plan-badge" id="planBadge">Free</span>
                    </div>
                </div>
            </div>

            <!-- Token budget -->
            <div class="status-section" id="tokenSection" style="display: none;">
                <div class="info-row">
                    <div class="status-label">Token Budget</div>
                    <div class="status-value" id="tokenText">0 / 0 tokens</div>
                    <div class="usage-bar">
                        <div class="usage-fill" id="tokenFill" style="width: 0%"></div>
                    </div>
                </div>
            </div>

            <!-- Render Studio button -->
            <div class="button-group">
                <button class="button" id="renderStudioBtn"><i class="fas fa-palette"></i> Render Studio</button>
            </div>

            <!-- View History button -->
            <div class="button-group">
                <button class="button" id="viewHistoryBtn"><i class="fas fa-history"></i> View History</button>
            </div>

            <!-- Send Feedback button -->
            <div class="button-group">
                <button class="button" id="feedbackBtn"><i class="fas fa-comment-dots"></i> Send Feedback</button>
            </div>

            <!-- Logout button at bottom -->
            <div class="button-group">
                <button class="button" id="logoutBtn"><i class="fas fa-sign-out-alt"></i> Logout</button>
            </div>
        </div>

        <div class="not-logged-in" id="notLoggedIn">
            <div class="status-section">
                <div class="status-label">Not Logged In</div>
                <div class="status-value" style="font-size: 14px; opacity: 0.9; margin-top: 10px;">
                    Click below to sign in with your RenderCAD account
                </div>
            </div>
            <button class="button primary" id="loginBtn"><i class="fas fa-sign-in-alt"></i> Sign In</button>
        </div>
    </div>

    <script src="renderer.js"></script>
</body>
</html>
